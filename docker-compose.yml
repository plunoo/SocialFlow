version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-socialflow_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sf_secure_pwd_2024_rpnmore}
      - POSTGRES_DB=${POSTGRES_DB:-socialflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    command: >
      sh -c "
      echo '<!DOCTYPE html>
      <html lang=\"en\">
      <head>
          <meta charset=\"UTF-8\">
          <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
          <title>SocialFlow AI - Effortless Social Growth</title>
          <script src=\"https://cdn.tailwindcss.com\"></script>
      </head>
      <body class=\"bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen\">
          <div class=\"container mx-auto px-4 py-16\">
              <div class=\"text-center mb-16\">
                  <h1 class=\"text-5xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-6\">
                      SocialFlow AI
                  </h1>
                  <p class=\"text-xl text-gray-600 mb-8 max-w-2xl mx-auto\">
                      Effortless Social Growth with AI-Powered Content
                  </p>
                  <div class=\"bg-green-50 border border-green-200 rounded-xl p-4 inline-block\">
                      <div class=\"flex items-center space-x-2\">
                          <div class=\"w-2 h-2 bg-green-500 rounded-full\"></div>
                          <span class=\"font-medium text-green-800\">Production Ready</span>
                      </div>
                  </div>
              </div>
          </div>
      </body>
      </html>' > /usr/share/nginx/html/index.html && 
      nginx -g 'daemon off;'
      "

volumes:
  postgres_data: