version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-socialflow_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sf_secure_pwd_2024_rpnmore}
      - POSTGRES_DB=${POSTGRES_DB:-socialflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}

volumes:
  postgres_data: